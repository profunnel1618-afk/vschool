<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Virtual School Demo</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 40px; }
    main { max-width: 780px; margin: auto; }
  </style>
</head>
<body>
  <main>
    <h1>Virtual School Demo</h1>
    <p>Test the EduSmartBot on this page.</p>
  </main>

  <!-- Chatbase widget (official embed) -->
  <script>
    window.chatbaseConfig = {
      chatbotId: "PqCH9sQBjkLjI_rQCRRwY"
    };
  </script>
  <script src="https://www.chatbase.co/embed.min.js" id="chatbase-script" defer></script>

  <!-- Client-side Custom Form schema -->
  <script>
  (function() {
    'use strict';

    const ACTION_NAME = 'pre_enrolment_form';
    let registered = false;

    /**
     * Poller: waits for registerFormSchema to exist
     */
    function waitForChatbase(callback, maxAttempts = 50, interval = 100) {
      let attempts = 0;
      const poll = setInterval(() => {
        attempts++;
        console.log(`[chatbase-poller] Attempt ${attempts}: checking registerFormSchema...`);

        if (
          typeof window.chatbase === 'function' &&
          typeof window.chatbase.registerFormSchema === 'function'
        ) {
          clearInterval(poll);
          console.log('[chatbase-poller] ✅ registerFormSchema available');
          callback();
        } else if (attempts >= maxAttempts) {
          clearInterval(poll);
          console.error('[chatbase-poller] ❌ Timed out waiting for registerFormSchema');
        }
      }, interval);
    }

    /**
     * Schema factory function
     */
    async function preEnrolmentSchema(args, user) {
      console.log('[chatbase] Schema function invoked with:', { args, user });

      return {
        fields: [
          {
            type: 'text',
            name: 'first_name',
            label: 'First name',
            placeholder: 'Enter your first name',
            validation: {
              required: { value: true, message: 'First name is required' }
            }
          },
          {
            type: 'text',
            name: 'last_name',
            label: 'Last name',
            placeholder: 'Enter your last name',
            validation: {
              required: { value: true, message: 'Last name is required' }
            }
          },
          {
            type: 'text',
            name: 'email',
            label: 'Email',
            placeholder: 'you@example.com',
            validation: {
              required: { value: true, message: 'Email is required' }
            }
          },
          {
            type: 'text',
            name: 'phone',
            label: 'Phone (+CC…)',
            placeholder: 'e.g., +971501234567',
            validation: {
              required: { value: true, message: 'Phone number is required' }
            }
          },
          {
            type: 'text',
            name: 'target_program',
            label: 'Target program',
            placeholder: 'e.g., Business Administration',
            validation: {
              required: { value: true, message: 'Target program is required' }
            }
          },
          {
            type: 'text',
            name: 'desired_intake',
            label: 'Desired intake (e.g., Sep 2025)',
            placeholder: 'e.g., Sep 2025',
            validation: {
              required: { value: true, message: 'Desired intake is required' }
            }
          },
          {
            type: 'checkbox',
            name: 'consent',
            label: 'I agree to be contacted',
            validation: {
              required: { value: true, message: 'You must agree to be contacted' }
            }
          }
        ],
        submitButtonText: 'Submit pre-enrolment',
        successMessage: 'Thanks! We'll contact you shortly.',
        errorMessage: 'Something went wrong. Please try again.'
      };
    }

    /**
     * Register the schema ONCE
     */
    function registerSchema() {
      if (registered) {
        console.warn('[chatbase] Schema already registered, skipping');
        return;
      }

      try {
        window.chatbase.registerFormSchema(ACTION_NAME, preEnrolmentSchema);
        registered = true;
        console.log(`[chatbase] ✅ Schema registered for "${ACTION_NAME}"`);
      } catch (err) {
        console.error('[chatbase] ❌ Registration failed:', err);
      }
    }

    // Initialize after page load
    if (document.readyState === 'complete') {
      waitForChatbase(registerSchema);
    } else {
      window.addEventListener('load', () => waitForChatbase(registerSchema));
    }

  })();
  </script>

</body>
</html>
